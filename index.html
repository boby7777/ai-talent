/* ============ 狀態 ============ */
const state = {
  step: 0,           // 0=說明, 1=基本資料, 2=能力自評, 3..N=動態題組, N+1=團隊協作, N+2=結果
  basic: { name: "", dept: "", title: "", role: "" },
  tools: [],
  toolsUsage: "",
  scenarios: [],
  groupAnswers: {},   // { scenarioKey: [val,val,val,val,val] }
  teamAnswers: [null, null, null, null, null]
};

function selectedScenarioObjs() {
  return state.scenarios.map(k => SCENARIOS.find(s => s.key === k));
}
function totalSteps() {
  // 0說明 + 1基本資料 + 2能力自評 + N動態題組 + 團隊協作 + 結果
  return 4 + state.scenarios.length;
}

/* ============ 計分 ============ */
function computeScores() {
  const acc = {};
  COMPETENCY_ORDER.forEach(c => acc[c] = { sum: 0, count: 0 });

  selectedScenarioObjs().forEach(sc => {
    const answers = state.groupAnswers[sc.key] || [];
    sc.questions.forEach((q, i) => {
      const val = answers[i];
      if (val) { acc[q.comp].sum += val; acc[q.comp].count += 1; }
    });
  });
  state.teamAnswers.forEach(val => {
    if (val) { acc["協作與領導"].sum += val; acc["協作與領導"].count += 1; }
  });

  const result = {};
  COMPETENCY_ORDER.forEach(c => {
    result[c] = acc[c].count > 0 ? +(acc[c].sum / acc[c].count).toFixed(2) : null;
  });
  return result;
}

function interpretation(score) {
  if (score === null) return { text: "本次未作答相關題目", color: "text-slate-400" };
  if (score >= 4.0) return { text: "對相關概念具良好至深入理解，能獨立應用並進行延伸判斷。", color: "text-emerald-600" };
  if (score >= 3.0) return { text: "具基本理解，於部分情境下可應用，仍有精進空間。", color: "text-amber-600" };
  return { text: "理解有限或尚未建立完整概念，建議加強學習與練習。", color: "text-rose-600" };
}

/* ============ 畫面渲染 ============ */
const app = document.getElementById("app");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const progressPct = document.getElementById("progressPct");
const progressLabel = document.getElementById("progressLabel");

function updateProgress() {
  if (state.step === 0) { progressWrap.classList.add("hidden"); return; }
  progressWrap.classList.remove("hidden");
  const last = totalSteps();
  const pct = Math.min(100, Math.round((state.step / last) * 100));
  progressBar.style.width = pct + "%";
  progressPct.textContent = pct + "%";
  progressLabel.textContent = `步驟 ${state.step} / ${last}`;
}

function render() {
  updateProgress();
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (state.step === 0) return renderIntro();
  if (state.step === 1) return renderBasic();
  if (state.step === 2) return renderSelfAssess();
  const scenarioIdx = state.step - 3;
  if (scenarioIdx < state.scenarios.length) return renderScenario(scenarioIdx);
  if (scenarioIdx === state.scenarios.length) return renderTeam();
  return renderResult();
}

        </ul>
      </div>
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-sm text-slate-600">
        <p class="font-medium text-slate-700 mb-1">題組作答方式</p>
        <p>問卷中「工作應用能力」部分，請先勾選您日常工作中最常使用 AI 的情境（1～3 項），系統將只顯示對應題組，其餘可略過。</p>
      </div>
      <button onclick="goStep(1)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">開始填答</button>
    </div>
  `;
}

function renderBasic() {
  const b = state.basic;
  app.innerHTML = html`
    <div class="fade-in space-y-5">
      <h2 class="text-lg font-semibold text-slate-800">【基本資料】</h2>
      <div class="grid gap-4">
        <label class="block text-sm">
          <span class="text-slate-600">姓名</span>
          <input id="f_name" type="text" value="${b.name}" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </label>
        <label class="block text-sm">
          <span class="text-slate-600">部門</span>
          <input id="f_dept" type="text" value="${b.dept}" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </label>
        <label class="block text-sm">
          <span class="text-slate-600">職稱</span>
          <input id="f_title" type="text" value="${b.title}" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </label>
        <div class="block text-sm">
          <span class="text-slate-600">主要職能</span>
          <div class="mt-2 grid grid-cols-2 sm:grid-cols-4 gap-2">
            ${ROLES.map(r => html`
              <label class="flex items-center gap-2 border border-slate-300 rounded-lg px-3 py-2 text-sm cursor-pointer has-[:checked]:bg-indigo-600 has-[:checked]:text-white has-[:checked]:border-indigo-600">
                <input type="radio" name="role" value="${r}" class="hidden" ${b.role === r ? "checked" : ""} onchange="setBasicRole('${r}')">
                ${r}
              </label>
            `).join("")}
          </div>
        </div>
      </div>
      <div class="flex justify-between pt-2">
        <button onclick="goStep(0)" class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700">上一步</button>
        <button onclick="submitBasic()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg transition">下一步</button>
      </div>
    </div>
  `;
}
function setBasicRole(r) { state.basic.role = r; }
function submitBasic() {
  state.basic.name = document.getElementById("f_name").value.trim();
  state.basic.dept = document.getElementById("f_dept").value.trim();
  state.basic.title = document.getElementById("f_title").value.trim();
  goStep(2);
}

function renderSelfAssess() {
  app.innerHTML = html`
    <div class="fade-in space-y-6">
      <h2 class="text-lg font-semibold text-slate-800">【AI 能力自評】</h2>

      <div>
        <p class="text-sm font-medium text-slate-700 mb-2">1. 您日常工作中，較常使用哪些 AI 工具？（多選）</p>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
          ${TOOLS.map(t => html`
            <label class="flex items-center gap-2 border border-slate-300 rounded-lg px-3 py-2 text-xs cursor-pointer has-[:checked]:bg-indigo-600 has-[:checked]:text-white has-[:checked]:border-indigo-600">
              <input type="checkbox" class="tool-cb hidden" value="${t}" ${state.tools.includes(t) ? "checked" : ""}>
              ${t}
            </label>
          `).join("")}
        </div>
      </div>

      <div>
        <p class="text-sm font-medium text-slate-700 mb-2">2. 承上題，請您針對上述所選其中 3 項工具，說明您如何使用在工作中。（問答題）</p>
        <textarea id="f_toolsUsage" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="例如：使用 ChatGPT 撰寫會議摘要與客戶信件初稿…">${state.toolsUsage}</textarea>
      </div>

      <div>
        <p class="text-sm font-medium text-slate-700 mb-1">3. 請您勾選日常工作中，使用 AI 做什麼工作？（選擇 1～3 項）</p>
        <p class="text-xs text-slate-400 mb-2">系統將依所選項目，僅顯示對應題組。</p>
        <div id="scenarioBox" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          ${SCENARIO_OPTIONS.map(s => html`
            <label class="flex items-center gap-2 border border-slate-300 rounded-lg px-3 py-2 text-sm cursor-pointer has-[:checked]:bg-indigo-600 has-[:checked]:text-white has-[:checked]:border-indigo-600">
              <input type="checkbox" class="scenario-cb hidden" value="${s.key}" ${state.scenarios.includes(s.key) ? "checked" : ""}>
              ${s.label}
            </label>
          `).join("")}
        </div>
        <p id="scenarioWarn" class="text-xs text-rose-500 mt-2 hidden">請至少勾選 1 項、最多勾選 3 項。</p>
      </div>

      <div class="flex justify-between pt-2">
        <button onclick="goStep(1)" class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700">上一步</button>
        <button onclick="submitSelfAssess()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg transition">下一步</button>
      </div>
    </div>
  `;

  // 限制最多勾選3項情境
  document.querySelectorAll(".scenario-cb").forEach(cb => {
    cb.addEventListener("change", () => {
      const checked = document.querySelectorAll(".scenario-cb:checked");
      if (checked.length > 3) { cb.checked = false; }
    });
  });
}
function submitSelfAssess() {
  state.tools = Array.from(document.querySelectorAll(".tool-cb:checked")).map(el => el.value);
  state.toolsUsage = document.getElementById("f_toolsUsage").value.trim();
  const scenarios = Array.from(document.querySelectorAll(".scenario-cb:checked")).map(el => el.value);
  if (scenarios.length < 1 || scenarios.length > 3) {
    document.getElementById("scenarioWarn").classList.remove("hidden");
    return;
  }
  state.scenarios = scenarios;
  scenarios.forEach(k => { if (!state.groupAnswers[k]) state.groupAnswers[k] = [null, null, null, null, null]; });
  goStep(3);
}

function likertRow(name, currentVal, onChange) {
  return html`
    <div class="grid grid-cols-5 gap-1.5">
      ${LIKERT.map(l => html`
        <label class="relative">
          <input type="radio" name="${name}" value="${l.v}" class="likert-input hidden" ${currentVal === l.v ? "checked" : ""} onchange="${onChange}(${l.v})">
          <span class="likert-label block text-center text-xs border border-slate-300 rounded-lg py-2 cursor-pointer hover:bg-slate-50">${l.label}<br><span class="text-[10px] opacity-70">${l.v}分</span></span>
        </label>
      `).join("")}
    </div>
  `;
}

function renderScenario(idx) {
  const sc = selectedScenarioObjs()[idx];
  const answers = state.groupAnswers[sc.key];
  app.innerHTML = html`
    <div class="fade-in space-y-6">
      <h2 class="text-lg font-semibold text-slate-800">【工作應用能力】</h2>
      <p class="text-sm text-indigo-600 font-medium">${sc.title}</p>
      <div class="space-y-6">
        ${sc.questions.map((q, i) => html`
          <div>
            <p class="text-sm text-slate-700 mb-2">${i + 1}. ${q.text}</p>
            ${likertRow(`q_${sc.key}_${i}`, answers[i], `setScenarioAnswer_${sc.key}_${i}`)}
            <p class="text-[11px] text-slate-400 mt-1">對應能力：${q.comp}</p>
          </div>
        `).join("")}
      </div>
      <div class="flex justify-between pt-2">
        <button onclick="goStep(${state.step - 1})" class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700">上一步</button>
        <button onclick="submitScenario('${sc.key}', ${idx})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg transition">下一步</button>
      </div>
      <p id="scWarn_${sc.key}" class="text-xs text-rose-500 hidden text-right">請完成本題組所有題目再繼續。</p>
    </div>
  `;
  // 動態產生每題的 change handler（掛在 window 上，因為 inline onchange 需要全域函式）
  sc.questions.forEach((q, i) => {
    window[`setScenarioAnswer_${sc.key}_${i}`] = (v) => { state.groupAnswers[sc.key][i] = v; };
  });
}
function submitScenario(key, idx) {
  const answers = state.groupAnswers[key];
  if (answers.some(v => v === null)) {
    document.getElementById(`scWarn_${key}`).classList.remove("hidden");
    return;
  }
  goStep(4 + idx);
}

function renderTeam() {
  app.innerHTML = html`
    <div class="fade-in space-y-6">
      <h2 class="text-lg font-semibold text-slate-800">【團隊與協作】</h2>
      <div class="space-y-6">
        ${TEAM_QUESTIONS.map((q, i) => html`
          <div>
            <p class="text-sm text-slate-700 mb-2">${i + 1}. ${q}</p>
            ${likertRow(`team_${i}`, state.teamAnswers[i], `setTeamAnswer_${i}`)}
            <p class="text-[11px] text-slate-400 mt-1">對應能力：協作與領導</p>
          </div>
        `).join("")}
      </div>
      <div class="flex justify-between pt-2">
        <button onclick="goStep(${state.step - 1})" class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700">上一步</button>
        <button onclick="submitTeam()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg transition">查看結果</button>
      </div>
      <p id="teamWarn" class="text-xs text-rose-500 hidden text-right">請完成所有題目再查看結果。</p>
    </div>
  `;
  TEAM_QUESTIONS.forEach((_, i) => {
    window[`setTeamAnswer_${i}`] = (v) => { state.teamAnswers[i] = v; };
  });
}
function submitTeam() {
  if (state.teamAnswers.some(v => v === null)) {
    document.getElementById("teamWarn").classList.remove("hidden");
    return;
  }
  goStep(state.step + 1);
}

let chartInstance = null;
function renderResult() {
  const scores = computeScores();
  app.innerHTML = html`
    <div class="fade-in space-y-6">
      <h2 class="text-lg font-semibold text-slate-800">評估結果</h2>
      <p class="text-sm text-slate-500">${state.basic.name || "您"} · ${state.basic.dept || "-"} · ${state.basic.title || "-"} · ${state.basic.role || "-"}</p>

      <div class="bg-slate-50 border border-slate-200 rounded-lg p-4">
        <canvas id="scoreChart" height="220"></canvas>
      </div>

      <div class="space-y-3">
        ${COMPETENCY_ORDER.map(c => {
          const s = scores[c];
          const it = interpretation(s);
          return html`
            <div class="border border-slate-200 rounded-lg p-4">
              <div class="flex items-center justify-between">
                <p class="font-medium text-slate-800">${c}</p>
                <p class="font-semibold ${it.color}">${s === null ? "—" : s.toFixed(2)}</p>
              </div>
              <p class="text-xs text-slate-400 mt-1">${COMPETENCIES[c]}</p>
              <p class="text-xs mt-2 ${it.color}">${it.text}</p>
            </div>
          `;
        }).join("")}
      </div>

      <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4 text-xs text-slate-600">
        <p class="font-medium text-indigo-700 mb-1">結果判讀標準（官方公式）</p>
        <p>各能力平均分 = 該能力所有題目分數總和 ÷ 題目數</p>
        <p>4.0 以上：良好至深入理解，能獨立應用並延伸判斷。　3.0–3.9：具基本理解，仍有精進空間。　3.0 以下：理解有限，建議加強學習。</p>
      </div>

      <div class="flex justify-between pt-2">
        <button onclick="goStep(${state.step - 1})" class="px-4 py-2 text-sm text-slate-500 hover:text-slate-700">上一步</button>
        <button onclick="restart()" class="px-4 py-2 text-sm text-indigo-600 hover:text-indigo-800 font-medium">重新填答</button>
      </div>
    </div>
  `;

  const ctx = document.getElementById("scoreChart");
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels: COMPETENCY_ORDER,
      datasets: [{
        label: "平均分數",
        data: COMPETENCY_ORDER.map(c => scores[c] ?? 0),
        backgroundColor: COMPETENCY_ORDER.map(c => {
          const s = scores[c];
          if (s === null) return "#cbd5e1";
          if (s >= 4.0) return "#10b981";
          if (s >= 3.0) return "#f59e0b";
          return "#f43f5e";
        }),
        borderRadius: 6
      }]
    },
    options: {
      indexAxis: "y",
      scales: { x: { min: 0, max: 5, ticks: { stepSize: 1 } } },
      plugins: { legend: { display: false } }
    }
  });
}

function restart() {
  state.step = 0;
  state.basic = { name: "", dept: "", title: "", role: "" };
  state.tools = [];
  state.toolsUsage = "";
  state.scenarios = [];
  state.groupAnswers = {};
  state.teamAnswers = [null, null, null, null, null];
  render();
}

function goStep(n) { state.step = n; render(); }

render();
</script>
</body>
</html>
